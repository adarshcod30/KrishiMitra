# =============================================================================
# KrishiMitra-RS pilot configuration
#
# Models one Rabi (winter) season over a canal command area — the operational
# unit the problem statement targets (PMKSY / command-area water management).
# Every number here is an agronomic assumption you can defend or tune:
#   - phenology curves drive the synthetic optical/SAR signatures AND the
#     growth-stage detection,
#   - FAO-56 Kc + root-zone parameters drive the ETc / water-deficit advisory.
#
# Swap `data.source: gee` and fill `aoi` to run on real Sentinel-1/2 instead.
# =============================================================================

pilot:
  name: "Demo Canal Command Area (Rabi)"
  # Indicative AOI over an Indo-Gangetic command area (used only by the GEE path).
  aoi_bbox: [77.30, 29.50, 77.55, 29.72]   # [min_lon, min_lat, max_lon, max_lat]
  epsg: 32643                               # UTM 43N (target grid for real data)
  pixel_size_m: 20                          # moderate resolution (LISS-IV / S2-agg)

season:
  # Rabi 2024-25: sowing from ~Nov, harvest ~Apr. Optical-friendly (low cloud).
  start_date: "2024-11-01"
  end_date:   "2025-04-15"
  composite_days: 8        # 8-day temporal compositing (matches advisory cadence)

data:
  source: "simulate"       # "simulate" (default, runs anywhere) | "gee"
  grid_hw: [140, 140]      # rows, cols for the simulated command area
  seed: 20250426
  cloud_fraction: 0.12     # fraction of optical composites masked (monsoon-like gaps)
  sar_speckle_db: 1.7      # residual speckle std (dB) after multi-look/Lee filtering
  noise:
    optical_sigma: 0.015   # reflectance noise
    smi_stress_events: 3   # number of dry-down episodes injected over the season

# -----------------------------------------------------------------------------
# Crop library. `fraction` sets how much of the command area each crop occupies.
# Phenology (day-of-year) shapes the NDVI double-logistic; SAR params shape the
# VV/VH response; FAO-56 block drives the water balance.
# -----------------------------------------------------------------------------
crops:
  - name: Wheat
    code: 1
    color: "#f4a63c"
    fraction: 0.34
    phenology: { sos_doy: 320, peak_doy: 40,  eos_doy: 105, ndvi_peak: 0.86, ndvi_base: 0.16 }
    sar:       { vh_peak_db: -14.0, vv_peak_db: -8.5, structure: erectophile }
    fao56:     { kc_ini: 0.30, kc_mid: 1.15, kc_end: 0.35,
                 L_ini: 20, L_dev: 30, L_mid: 55, L_late: 35,
                 root_depth_m: 1.2, depletion_p: 0.55 }
  - name: Mustard
    code: 2
    color: "#e7d020"
    fraction: 0.20
    phenology: { sos_doy: 315, peak_doy: 25,  eos_doy: 80,  ndvi_peak: 0.74, ndvi_base: 0.15 }
    sar:       { vh_peak_db: -16.5, vv_peak_db: -9.5, structure: planophile }
    fao56:     { kc_ini: 0.35, kc_mid: 1.10, kc_end: 0.35,
                 L_ini: 20, L_dev: 30, L_mid: 40, L_late: 25,
                 root_depth_m: 1.0, depletion_p: 0.60 }
  - name: Sugarcane
    code: 3
    color: "#3fa34d"
    fraction: 0.16
    phenology: { sos_doy: 300, peak_doy: 55,  eos_doy: 150, ndvi_peak: 0.90, ndvi_base: 0.30 }
    sar:       { vh_peak_db: -11.5, vv_peak_db: -6.5, structure: volume }
    fao56:     { kc_ini: 0.40, kc_mid: 1.25, kc_end: 0.75,
                 L_ini: 35, L_dev: 60, L_mid: 190, L_late: 120,
                 root_depth_m: 1.5, depletion_p: 0.65 }
  - name: Potato
    code: 4
    color: "#b5651d"
    fraction: 0.12
    phenology: { sos_doy: 305, peak_doy: 20,  eos_doy: 60,  ndvi_peak: 0.82, ndvi_base: 0.14 }
    sar:       { vh_peak_db: -15.0, vv_peak_db: -9.0, structure: planophile }
    fao56:     { kc_ini: 0.50, kc_mid: 1.15, kc_end: 0.75,
                 L_ini: 25, L_dev: 30, L_mid: 30, L_late: 20,
                 root_depth_m: 0.6, depletion_p: 0.35 }
  - name: Gram
    code: 5
    color: "#7a9e5e"
    fraction: 0.10
    phenology: { sos_doy: 318, peak_doy: 35,  eos_doy: 95,  ndvi_peak: 0.70, ndvi_base: 0.15 }
    sar:       { vh_peak_db: -17.0, vv_peak_db: -10.0, structure: planophile }
    fao56:     { kc_ini: 0.40, kc_mid: 1.00, kc_end: 0.35,
                 L_ini: 20, L_dev: 30, L_mid: 40, L_late: 25,
                 root_depth_m: 1.0, depletion_p: 0.50 }
  - name: Fallow
    code: 0
    color: "#9a8c7a"
    fraction: 0.08
    phenology: { sos_doy: 0, peak_doy: 0, eos_doy: 0, ndvi_peak: 0.22, ndvi_base: 0.16 }
    sar:       { vh_peak_db: -19.0, vv_peak_db: -11.5, structure: bare }
    fao56:     { kc_ini: 0.15, kc_mid: 0.15, kc_end: 0.15,
                 L_ini: 0, L_dev: 0, L_mid: 0, L_late: 0,
                 root_depth_m: 0.3, depletion_p: 0.50 }

# -----------------------------------------------------------------------------
# Meteorology for the command area (season means; the generator adds daily
# variability + discrete rainfall/irrigation events). Replace with IMD / ERA5
# / weather-grid series for a real deployment.
# -----------------------------------------------------------------------------
meteorology:
  et0_mm_day_mean: 3.2          # reference ET (FAO-56 Penman-Monteith) winter mean
  et0_mm_day_amp: 1.4           # seasonal swing (lower in Dec-Jan, higher in Mar-Apr)
  seasonal_rain_mm: 95          # total Rabi rainfall over the command area
  rain_events: 6                # discrete western-disturbance rain spells
  soil:
    field_capacity: 0.32        # volumetric (-)
    wilting_point: 0.12         # volumetric (-)
    total_available_water_mm_m: 200  # TAW per metre of root depth

# -----------------------------------------------------------------------------
# Ground-truth sampling for supervised training (mimics field survey points).
# -----------------------------------------------------------------------------
ground_truth:
  points_per_class: 220         # labelled pixels per crop for train+val
  train_fraction: 0.65
  min_separation_px: 2          # spatial thinning to reduce train/val leakage

# -----------------------------------------------------------------------------
# Moisture-stress thresholds. Stage-aware: the same VCI can be tolerable at
# maturity but critical at flowering, so multipliers scale the cutoffs.
# -----------------------------------------------------------------------------
stress:
  vci_bins:   [0.20, 0.40, 0.60]   # -> Severe / Moderate / Mild / None
  smi_bins:   [0.20, 0.40, 0.60]
  # weight of optical (VCI) vs microwave (SMI) in the fused stress index
  optical_weight: 0.6
  stage_sensitivity:              # multiplies stress score by growth-stage risk
    sowing: 0.7
    vegetative: 1.0
    flowering: 1.35               # most drought-sensitive stage
    maturity: 0.6

advisory:
  # Map root-zone depletion (as % of Readily Available Water, RAW) to an action.
  # <50% None | 50-80% Monitor | 80-100% Schedule | >=100% Irrigate now (RAW spent)
  depletion_pct_bins: [50, 80, 100]
  irrigation_efficiency: 0.65     # surface irrigation application efficiency
  min_advisory_mm: 5              # ignore recommended depths below this
  # Mute active advice inside the final pre-harvest ripening window (days before
  # the crop's agronomic harvest date) — irrigating then wastes water.
  stop_irrigation_days_before_harvest: 15
  # --- FAO-56 bucket <- satellite data assimilation --------------------------
  # Weight of the satellite wetness observation in the analysis blend; the
  # prognostic bucket keeps the remaining (1 - w). Keep this small: the model
  # integrates the balance, the observation only nudges it.
  assimilation_weight: 0.25
  # Share of the model-observation discrepancy attributed to irrigation the
  # pipeline cannot see (canal deliveries / tubewell pumping). One-sided source.
  irrigation_inference_gain: 0.5

output:
  dir: "outputs"
  save_geotiff: true              # written only if rasterio is installed
  dpi: 130
