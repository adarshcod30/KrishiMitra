[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrotech-ml"
version = "0.1.0"
description = "ML-heavy crop recommendation service with FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn[standard]==0.41.0",
  "numpy==2.4.3",
  "pandas==3.0.1",
  "scikit-learn==1.8.0",
  "xgboost==3.2.0",
  "lightgbm==4.6.0",
  "catboost==1.2.10",
  "optuna==4.7.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "joblib==1.5.3",
  "python-multipart==0.0.22",
  "httpx==0.28.1"
]

[project.optional-dependencies]
# Managed Postgres (Neon, Supabase, any Postgres URL). Needed only when
# AGROTECH_DATABASE_URL is set; unset it and the service uses local SQLite.
postgres = [
  "psycopg[binary]>=3.2,<4"
]
# Optional S3-compatible uploads (Cloudflare R2, Supabase Storage, Backblaze
# B2, MinIO, AWS S3). Needed only when the AGROTECH_S3_* variables are set;
# with them unset, uploads go to the local filesystem.
s3 = [
  "boto3>=1.34,<2"
]
# Convenience aggregate used by the container build (PIP_EXTRAS=cloud).
# Local development (SQLite + local directories) needs none of this.
cloud = [
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.34,<2"
]

[project.scripts]
agrotech-train = "agrotech_ml.services.train:main"
agrotech-api = "agrotech_ml.api:main"

[tool.setuptools.packages.find]
where = ["src"]
