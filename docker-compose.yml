# =============================================================================
# KrishiMitra — the whole stack on one laptop, with NO cloud account of any kind.
#
#   docker compose up --build            # postgres + api + web
#   docker compose down                  # stop, keep the database
#   docker compose down -v               # stop AND DELETE the local database
#   docker compose --profile satellite run --rm satellite
#
#   Frontend  http://localhost:3000
#   API       http://localhost:8080/health   ·   /docs for the OpenAPI UI
#   Postgres  127.0.0.1:5432  (agrotech / agrotech_local_dev_only)
#
# This is the local mirror of the deployed topology, not a copy of it:
#
#   deployed                          docker compose
#   ------------------------------    -------------------------------------
#   Neon (serverless Postgres)   ->   postgres:17-alpine service
#   Hugging Face Space (Docker)  ->   api service, spaces/api/Dockerfile
#   Vercel (native Next.js)      ->   web service, Dockerfile.web
#   Space secrets                ->   plain env vars (LOCAL DEV ONLY)
#   optional S3 uploads bucket   ->   named volume api-uploads
#
# The api image is byte-for-byte the one the Space builds — same Dockerfile,
# same relative paths — so a bug reproduced here is a bug there. The only
# difference is $PORT: 8080 locally to match the docs, 7860 on the Space.
#
# The secret values below are deliberately obvious throwaways. Never reuse them.
#
# ZERO-CONFIG MODE (no containers at all) is still the shortest path and is not
# replaced by any of this:
#     npm run dev        # frontend on :3000
#     npm run dev:ml     # API on :8000, SQLite + local directories, no env vars
# To exercise that same SQLite path *inside* compose, set
# AGROTECH_DATABASE_URL to "" on the api service below.
# =============================================================================

name: krishimitra

services:
  # ---------------------------------------------------------------------------
  # Postgres — stands in for Neon. Same major version, so schema and SQL
  # behaviour match what the deployed database will do.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrotech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrotech_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-agrotech}
      # Deterministic collation, so ORDER BY does not differ from the hosted DB.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Exposed so you can psql into it. Loopback only — never 0.0.0.0.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api waits on this, so it never races a database that has accepted a TCP
      # connection but has not finished initdb.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrotech} -d ${POSTGRES_DB:-agrotech}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # FastAPI ML service — the exact image the Hugging Face Space runs.
  # ---------------------------------------------------------------------------
  api:
    build:
      # Repository root as context: spaces/api/Dockerfile reads ml-service/*,
      # and the Space repo (assembled by spaces/api/sync.sh) presents the same
      # relative layout. One Dockerfile, two hosts, no drift.
      context: .
      dockerfile: spaces/api/Dockerfile
      args:
        # Set WITH_S3=0 for a smaller image if you will never test the optional
        # S3-compatible uploads backend locally.
        WITH_S3: "${WITH_S3:-1}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The image defaults to 7860 (the Space's app_port). Locally we use 8080
      # so the URLs in the docs and in ML_API_URL below stay stable.
      PORT: "8080"

      # A plain TCP URL here; on the Space this is the Neon connection string
      # (…?sslmode=require). The application must not care which — that is the
      # contract. Set to "" to fall back to SQLite in ./artifacts.
      AGROTECH_DATABASE_URL: "postgresql://${POSTGRES_USER:-agrotech}:${POSTGRES_PASSWORD:-agrotech_local_dev_only}@db:5432/${POSTGRES_DB:-agrotech}"

      AGROTECH_ENVIRONMENT: "development"
      AGROTECH_ARTIFACTS_DIR: "/home/user/app/artifacts"
      AGROTECH_UPLOADS_DIR: "/home/user/app/uploads"
      AGROTECH_PUBLIC_BASE_URL: "http://localhost:8080"
      AGROTECH_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"

      # Write auth off by default locally. Flip both to exercise the production
      # auth path (and set AGROTECH_ADMIN_PASSWORD_HASH to a real hash).
      AGROTECH_REQUIRE_WRITE_AUTH: "${AGROTECH_REQUIRE_WRITE_AUTH:-false}"
      AGROTECH_JWT_SECRET: "local-development-only-not-a-real-secret"
      AGROTECH_ADMIN_USERNAME: "admin"

      WEB_CONCURRENCY: "1"

      # Optional S3-compatible uploads (Cloudflare R2 / Supabase / MinIO).
      # All empty -> local disk, which is the default and needs no account.
      AGROTECH_S3_ENDPOINT_URL: "${AGROTECH_S3_ENDPOINT_URL:-}"
      AGROTECH_S3_BUCKET: "${AGROTECH_S3_BUCKET:-}"
      AGROTECH_S3_ACCESS_KEY_ID: "${AGROTECH_S3_ACCESS_KEY_ID:-}"
      AGROTECH_S3_SECRET_ACCESS_KEY: "${AGROTECH_S3_SECRET_ACCESS_KEY:-}"
      AGROTECH_S3_PUBLIC_BASE_URL: "${AGROTECH_S3_PUBLIC_BASE_URL:-}"

      # Third-party keys. Left empty so the dependent features degrade exactly
      # as they would in production with an unset secret.
      AGROTECH_SARVAM_API_KEY: "${AGROTECH_SARVAM_API_KEY:-}"
      AGROTECH_BRAVE_SEARCH_API_KEY: "${AGROTECH_BRAVE_SEARCH_API_KEY:-}"
      AGROTECH_MYSCHEME_API_KEY: "${AGROTECH_MYSCHEME_API_KEY:-}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Named volumes, not bind mounts: ml-service/artifacts is a developer's
      # working directory (a symlink to /tmp on some checkouts), and
      # bind-mounting it would drag host paths and permissions into the
      # container. Docker seeds a fresh named volume from the image, so models
      # baked into the image are present on first run and survive `down`.
      #
      # To push models you trained on the host into a running stack:
      #   docker compose cp ml-service/artifacts/crop_model.joblib api:/home/user/app/artifacts/
      - api-artifacts:/home/user/app/artifacts
      - api-uploads:/home/user/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous: with no baked models the first boot trains them from
      # data/Crop_dataset.csv before the port answers.
      start_period: 180s

  # ---------------------------------------------------------------------------
  # Next.js frontend. Vercel builds this natively and never sees Dockerfile.web;
  # it exists so the stack is runnable offline and self-hostable.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Build-time, inlined into the client bundle. "/api/ml" routes browser
        # calls through the Next.js server proxy, exactly as in production.
        NEXT_PUBLIC_ML_API_URL: "${NEXT_PUBLIC_ML_API_URL:-/api/ml}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "production"
      # Server-side only, read per request by the /api/ml route handler. On the
      # compose network the API is reachable by service name; on Vercel this is
      # the Hugging Face Space URL.
      ML_API_URL: "http://api:8080"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Satellite batch pipeline — optional, behind a profile because it is a
  # run-to-completion batch job, not a server: `docker compose up` must not
  # start it.
  #
  #   docker compose --profile satellite run --rm satellite
  #   docker compose --profile satellite run --rm satellite --source gee
  #
  # Google Earth Engine is a satellite DATA SOURCE (free for research /
  # non-commercial use), not deployment infrastructure. It stays optional: the
  # default `--source simulate` run needs no credentials and no network.
  # ---------------------------------------------------------------------------
  satellite:
    profiles: ["satellite"]
    build:
      context: ./satellite-ml
      dockerfile: Dockerfile
      args:
        # gee = earthengine-api + geopandas. Add ",geo" for GeoTIFF output.
        # Build with EXTRAS="" for a ~350 MB smaller simulate-only image.
        EXTRAS: "${SATELLITE_EXTRAS:-gee}"
    environment:
      MPLBACKEND: "Agg"
      # Earth Engine, only needed for --source gee. Accepts raw JSON or a path
      # to a mounted key file; leave both unset to fall back to whatever
      # credentials are mounted below.
      EE_PROJECT: "${EE_PROJECT:-}"
      EE_SERVICE_ACCOUNT_JSON: "${EE_SERVICE_ACCOUNT_JSON:-}"
    volumes:
      - satellite-outputs:/app/outputs
      # Uncomment to reuse a host Earth Engine / gcloud ADC login:
      # - ${HOME}/.config/gcloud:/home/app/.config/gcloud:ro

volumes:
  pgdata:
  api-artifacts:
  api-uploads:
  satellite-outputs:
