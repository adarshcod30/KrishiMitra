<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- KrishiMitra favicon: a sprout on agricultural green.
       Chunky shapes so it stays legible at 16px. -->
  <rect width="64" height="64" rx="14" fill="#1a6b3c"/>
  <!-- stem -->
  <path d="M32 54 C32 44 32 37 32 26" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- left leaf -->
  <path d="M31 38 C21 38 13.5 31 12 20 C23 20.5 30.5 27 31.5 38 Z" fill="#ffffff"/>
  <!-- right leaf -->
  <path d="M33 30 C43 30 50.5 23 52 12 C41 12.5 33.5 19 32.5 30 Z" fill="#ffffff"/>
  <!-- ground dot -->
  <circle cx="32" cy="56.5" r="2.6" fill="#a8d5b5"/>
</svg>
